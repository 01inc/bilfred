[project]
name = "bilfred-api"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.135.3",
  "pydantic==2.13.4",
  "psycopg[binary]==3.3.8",
  "httpx==0.28.1",
  "uvicorn==0.41.0",
  "email-validator==2.3.0",
]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.6"]

[tool.ruff]
target-version = "py312"
line-length = 100
